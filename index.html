<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КВАНТ — Биржа</title>
  <script src="https://unpkg.com"></script>
  <script src="https://unpkg.com"></script>
  <style>
    :root { --bg: #0f0f13; --card: #181820; --accent: #7c5dfa; --text: #ffffff; --muted: #8e8ea0; --green: #00d084; }
    body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-weight: bold; font-size: 18px; }
    .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .balances { display: flex; justify-content: space-between; gap: 10px; }
    .bal-box { background: #22222d; padding: 12px; border-radius: 12px; flex: 1; }
    .bal-title { font-size: 12px; color: var(--muted); }
    .bal-val { font-size: 22px; font-weight: bold; margin-top: 4px; }
    .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; font-size: 14px; }
    .btn-green { background: var(--green); color: #000; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #121217; color: white; margin-bottom: 10px; font-size: 14px; }
    .order-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #2a2a35; }
    .order-item:last-child { border-bottom: none; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; padding: 10px; border-top: 1px solid #2a2a35; }
    .nav button { flex: 1; background: none; border: none; color: var(--muted); font-weight: bold; padding: 10px; cursor: pointer; }
    .nav button.active { color: var(--accent); }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <div>⚡ КВАНТ</div>
    <div id="user-display" style="font-size: 14px; color: var(--muted);">Вход...</div>
  </div>

  <div id="tab-wallet">
    <div class="card">
      <div class="balances">
        <div class="bal-box">
          <div class="bal-title">ВАШИ КВАНТЫ</div>
          <div class="bal-val"><span id="qnt-bal">0</span> <span style="font-size:14px;color:var(--accent)">QNT</span></div>
        </div>
        <div class="bal-box">
          <div class="bal-title">ВИРТУАЛЬНЫЕ $</div>
          <div class="bal-val"><span id="usd-bal">0</span> <span style="font-size:14px;color:var(--green)">$</span></div>
        </div>
      </div>
      <button class="btn" style="margin-top: 12px;" onclick="claimBonus()">+ Бонус (20 QNT)</button>
    </div>

    <div class="card">
      <div style="font-size: 14px; color: var(--muted); margin-bottom: 10px;">ВЫСТАВИТЬ QNT НА ПРОДАЖУ</div>
      <input type="number" id="sell-amount" placeholder="Количество QNT (например: 50)">
      <input type="number" id="sell-price" step="0.1" placeholder="Цена за 1 QNT в $ (например: 2.5)">
      <button class="btn" onclick="createOrder()">Создать заявку на продажу</button>
    </div>
  </div>

  <div id="tab-market" class="hidden">
    <div class="card">
      <div style="font-size: 14px; color: var(--muted); margin-bottom: 8px;">ГРАФИК КУРСА QNT / $</div>
      <canvas id="priceChart" height="160"></canvas>
    </div>

    <div class="card">
      <div style="font-size: 14px; color: var(--muted); margin-bottom: 8px;">АКТИВНЫЕ ЗАЯВКИ ИГРОКОВ</div>
      <div id="orders-list">Загрузка заявок...</div>
    </div>
  </div>

  <div class="nav">
    <button id="btn-wallet" class="active" onclick="switchTab('wallet')">💳 Кошелек</button>
    <button id="btn-market" onclick="switchTab('market')">📈 Биржа и График</button>
  </div>

<script>
  const SUPABASE_URL = 'https://supabase.co';
  const SUPABASE_KEY = 'sb_publishable_1SVkQ6KVIUGl07HEhwufzA_cb8i31dm';
  let db = null;
  let currentUser = null;
  let chartInstance = null;

  async function initUser() {
    if (!window.supabase) {
      alert('Ошибка загрузки базы данных. Проверьте интернет.');
      return;
    }
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let savedName = localStorage.getItem('kvant_username');
    if (!savedName) {
      savedName = prompt('Придумайте ваш никнейм для биржи КВАНТ:') || 'Игрок_' + Math.floor(Math.random()*1000);
      localStorage.setItem('kvant_username', savedName);
    }

    let { data: user } = await db.from('users').select('*').eq('username', savedName).single();
    if (!user) {
      const { data: newUser } = await db.from('users').insert([{ username: savedName }]).select().single();
      user = newUser;
    }
    currentUser = user;
    document.getElementById('user-display').innerText = '@' + currentUser.username;
    updateUI();
  }

  async function updateUI() {
    if (!currentUser) return;
    const { data: user } = await db.from('users').select('*').eq('id', currentUser.id).single();
    if (user) {
      currentUser = user;
      document.getElementById('qnt-bal').innerText = Number(user.qnt_balance).toFixed(1);
      document.getElementById('usd-bal').innerText = Number(user.usd_balance).toFixed(2);
    }
    loadOrders();
    loadChart();
  }

  async function claimBonus() {
    await db.from('users').update({ qnt_balance: Number(currentUser.qnt_balance) + 20 }).eq('id', currentUser.id);
    updateUI();
  }

  async function createOrder() {
    const amount = parseFloat(document.getElementById('sell-amount').value);
    const price = parseFloat(document.getElementById('sell-price').value);
    if (!amount || !price || amount <= 0 || price <= 0) return alert('Введите корректные числа');
    if (amount > currentUser.qnt_balance) return alert('Недостаточно QNT на балансе');

    await db.from('users').update({ qnt_balance: Number(currentUser.qnt_balance) - amount }).eq('id', currentUser.id);
    await db.from('orders').insert([{ seller_id: currentUser.id, seller_name: currentUser.username, amount, price }]);
    
    document.getElementById('sell-amount').value = '';
    document.getElementById('sell-price').value = '';
    alert('Заявка выставлена на биржу!');
    updateUI();
  }

  async function loadOrders() {
    const { data: orders } = await db.from('orders').select('*').eq('status', 'open').order('price', { ascending: true });
    const list = document.getElementById('orders-list');
    if (!orders || orders.length === 0) {
      list.innerHTML = '<div style="color:var(--muted);font-size:13px;">Пока нет активных заявок. Будьте первым!</div>';
      return;
    }
    list.innerHTML = orders.map(o => `
      <div class="order-item">
        <div>
          <div style="font-weight:bold;">${o.amount} QNT <span style="color:var(--green)">по ${o.price}$</span></div>
          <div style="font-size:12px;color:var(--muted);">Продавец: @${o.seller_name} • Итого: ${(o.amount * o.price).toFixed(2)}$</div>
        </div>
        ${o.seller_id !== currentUser.id 
          ? `<button class="btn btn-green" style="width:auto;padding:8px 14px;" onclick="buyOrder('${o.id}')">Купить</button>` 
          : `<span style="font-size:12px;color:var(--muted);">Ваша заявка</span>`}
      </div>
    `).join('');
  }

  async function buyOrder(orderId) {
    const { error } = await db.rpc('buy_order', { order_id: orderId, buyer_id: currentUser.id });
    if (error) alert('Ошибка: ' + error.message);
    else { alert('Покупка успешно совершена!'); updateUI(); }
  }

  async function loadChart() {
    if (!window.Chart) return;
    const { data: history } = await db.from('price_history').select('*').order('created_at', { ascending: true }).limit(30);
    if (!history) return;

    const labels = history.map(h => new Date(h.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
    const prices = history.map(h => h.price);

    const ctx = document.getElementById('priceChart').getContext('2d');
    if (chartInstance) chartInstance.destroy();
    chartInstance = new window.Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Цена 1 QNT ($)',
          data: prices,
          borderColor: '#7c5dfa',
          backgroundColor: 'rgba(124, 93, 250, 0.15)',
          borderWidth: 2,
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: { x: { display: false }, y: { grid: { color: '#2a2a35' }, ticks: { color: '#8e8ea0' } } }
      }
    });
  }

  function switchTab(tab) {
    document.getElementById('tab-wallet').classList.toggle('hidden', tab !== 'wallet');
    document.getElementById('tab-market').classList.toggle('hidden', tab !== 'market');
    document.getElementById('btn-wallet').classList.toggle('active', tab === 'wallet');
    document.getElementById('btn-market').classList.toggle('active', tab === 'market');
    if (tab === 'market') updateUI();
  }

  window.onload = initUser;
</script>
</body>
</html>
