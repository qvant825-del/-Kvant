<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>КВАНТ</title><style>:root{--bg:#0b0d14;--c:#161926;--ac:#7c5dfa;--tx:#fff;--mt:#8e95a9;--ok:#00b894;--er:#ff4757;--gd:#f1c40f}*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:var(--bg);color:var(--tx);padding:16px 16px 80px;max-width:480px;margin:0 auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-weight:800;font-size:20px}.card{background:var(--c);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;margin-bottom:14px}.lbl{font-size:11px;text-transform:uppercase;color:var(--mt);margin-bottom:6px}.bal{font-size:40px;font-weight:800;margin-bottom:16px}.bal span{font-size:20px;color:var(--ac)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{background:var(--ac);color:#fff;border:none;min-height:46px;padding:12px;border-radius:12px;font-size:15px;font-weight:600;width:100%}button:disabled{opacity:.4}.ghost{background:rgba(255,255,255,.08);margin-top:8px}input{width:100%;min-height:46px;background:#0d1018;border:1px solid rgba(255,255,255,.1);color:#fff;padding:12px;border-radius:12px;font-size:16px;margin-bottom:10px}.v{display:none}.v.on{display:block}.tx{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}#t{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ok);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;display:none;z-index:99}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:480px;margin:0 auto}.nb{background:0 0;color:var(--mt)}.nb.on{color:var(--ac);background:rgba(124,93,250,.15)}</style></head><body><div id="t"></div><header><span>⚡ КВАНТ</span><span id="st" style="font-size:13px;color:var(--mt)">Базовый</span></header><div id="vw" class="v on"><div class="card"><div class="lbl">Ваш баланс</div><div class="bal"><b id="bd">0</b> <span>QNT</span></div><div class="grid"><button onclick="bn()">+ Бонус (20)</button><button onclick="tt()">↗ Отправить чек</button></div></div><div id="tc" class="card" style="display:none"><div class="lbl">Создать ссылку-чек для друга</div><input id="ia" type="number" inputmode="numeric" placeholder="Сколько QNT отправить?"><button onclick="mk()">Создать и скопировать ссылку</button></div><div class="card"><div class="lbl">История</div><div id="tl">Пусто</div></div></div><div id="vs" class="v"><div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><b>VIP-статус</b><p style="font-size:13px;color:var(--mt)">Особый статус в шапке</p></div><button id="bv" style="width:auto" onclick="vp()">150 QNT</button></div></div><nav class="nav"><button class="nb on" onclick="sv('w',this)">💳 Кошелек</button><button class="nb" onclick="sv('s',this)">🛍 Магазин</button></nav><script>let s=JSON.parse(localStorage.getItem("kv_p2p"))||{b:0,vip:0,lb:0,h:[],u:[]};const save=()=>localStorage.setItem("kv_p2p",JSON.stringify(s));const ms=(m,e)=>{let x=document.getElementById("t");x.textContent=m;x.style.background=e?"var(--er)":"var(--ok)";x.style.display="block";setTimeout(()=>x.style.display="none",2500)};const rn=()=>{document.getElementById("bd").textContent=s.b;let st=document.getElementById("st"),bv=document.getElementById("bv");if(s.vip){st.textContent="VIP 👑";st.style.color="var(--gd)";bv.textContent="Куплено";bv.disabled=1}document.getElementById("tl").innerHTML=s.h.length?s.h.slice(0,8).map(x=>`<div class="tx"><span>${x.t}</span><b style="color:${x.a>0?'var(--ok)':'var(--er)'}">${x.a>0?'+':''}${x.a} QNT</b></div>`).join(""):"Пусто"};function bn(){if(Date.now()-s.lb<15000)return ms("Ждите 15 сек.",1);s.b+=20;s.lb=Date.now();s.h.unshift({t:"Бонус",a:20});save();rn();ms("+20 QNT!")}function vp(){if(s.vip||s.b<150)return ms("Нужно 150 QNT",1);s.b-=150;s.vip=1;s.h.unshift({t:"VIP-статус",a:-150});save();rn();ms("VIP куплен!")}const tt=()=>{let c=document.getElementById("tc");c.style.display=c.style.display=="none"?"block":"none"};function mk(){let a=Math.floor(Number(document.getElementById("ia").value));if(a<=0||a>s.b)return ms("Неверная сумма",1);s.b-=a;s.h.unshift({t:"Создан чек",a:-a});save();rn();let code=btoa(a+"_"+Date.now());let link=location.origin+location.pathname+"?pay="+code;navigator.clipboard?.writeText(link);document.getElementById("ia").value="";tt();prompt("Скопируйте и отправьте ссылку другу:",link)}function chk(){let p=new URLSearchParams(location.search).get("pay");if(!p)return;history.replaceState(null,"",location.pathname);if(s.u.includes(p))return ms("Чек уже активирован!",1);try{let a=Number(atob(p).split("_")[0]);if(a>0){s.b+=a;s.u.push(p);s.h.unshift({t:"Перевод по чеку",a:a});save();ms("Получено +"+a+" QNT!")}}catch{}}const sv=(n,b)=>{document.querySelectorAll(".v").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".nb").forEach(x=>x.classList.remove("on"));document.getElementById("v"+n).classList.add("on");b.classList.add("on")};chk();rn()</script></body></html>
