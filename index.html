<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0d14"><title>КВАНТ — Облачный кошелек</title><style>:root{--bg:#0b0d14;--card:#161926;--b:rgba(255,255,255,.08);--ac:#7c5dfa;--tx:#fff;--mt:#8e95a9;--ok:#00b894;--er:#ff4757;--gd:#f1c40f}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}body{background:var(--bg);color:var(--tx);min-height:100dvh;padding:16px 16px 90px}.app{max-width:480px;margin:0 auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.logo{font-size:21px;font-weight:800}.chip{background:var(--card);border:1px solid var(--b);padding:8px 14px;border-radius:24px;font-size:13px;color:var(--mt);cursor:pointer}.card{background:var(--card);border:1px solid var(--b);border-radius:20px;padding:20px;margin-bottom:14px}.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mt);margin-bottom:6px}.bal{font-size:42px;font-weight:800;margin-bottom:20px}.bal span{font-size:22px;color:var(--ac)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}button{background:var(--ac);color:#fff;border:none;min-height:48px;padding:12px;border-radius:14px;font-size:15px;font-weight:600;width:100%;cursor:pointer}button:active{transform:scale(.97)}button:disabled{opacity:.4;transform:none}.ghost{background:rgba(255,255,255,.06);border:1px solid var(--b);font-size:14px}input{width:100%;min-height:48px;background:#0d1018;border:1px solid var(--b);color:#fff;padding:12px;border-radius:14px;font-size:16px;margin-bottom:10px;outline:none;user-select:text}input:focus{border-color:var(--ac)}.v{display:none}.v.on{display:block}.shop{display:flex;justify-content:space-between;align-items:center;gap:12px}.shop button{width:auto;min-width:100px}.tx{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--b);font-size:14px}.tx:last-child{border:none}.vip{color:var(--gd);font-weight:700}#t{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:99;display:none;white-space:nowrap}.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(22,25,38,.95);backdrop-filter:blur(12px);border-top:1px solid var(--b);padding:8px 12px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.nb{background:0 0;min-height:44px;padding:4px;color:var(--mt);font-size:12px}.nb.on{color:var(--ac);background:rgba(124,93,250,.15)}</style></head><body><div id="t"></div><div class="app"><header><div class="logo">⚡ КВАНТ</div><div class="chip" onclick="cp()">ID: <b id="tid" style="color:#fff">...</b> 📋</div></header><div id="vw" class="v on"><div class="card"><div class="lbl">Облачный баланс</div><div class="bal"><b id="bd">0</b> <span>QNT</span></div><div class="grid"><button onclick="bn()">+ Бонус (20)</button><button onclick="tt()">↗ Перевести</button></div><button class="ghost" onclick="rf()">🔄 Обновить баланс из сети</button></div><div id="tc" class="card" style="display:none"><div class="lbl" style="margin-bottom:10px">Перевод пользователю</div><input id="it" placeholder="ID получателя (QNT-1234)" autocapitalize="characters"><input id="ia" type="number" inputmode="numeric" placeholder="Сумма QNT"><button onclick="sq()">Отправить QNT</button></div><div class="card"><div class="lbl" style="margin-bottom:8px">История операций</div><div id="tl" style="font-size:13px;color:var(--mt)">История пуста</div></div></div><div id="vs" class="v"><div class="card shop"><div><h3 style="font-size:16px;margin-bottom:4px">VIP-статус</h3><p style="font-size:13px;color:var(--mt)">Меняет статус в базе навсегда</p></div><button id="bv" onclick="vp()">150 QNT</button></div></div><div id="vp" class="v"><div class="card"><div class="lbl">Ваш аккаунт</div><h3 style="margin:8px 0">ID: <span id="pid" style="color:var(--ac)">...</span></h3><p style="margin-bottom:10px">Статус: <span id="pst">Базовый</span></p><p style="font-size:13px;color:var(--mt)">Нажмите на ID в правом верхнем углу, чтобы скопировать и отправить другу для переводов.</p></div><div class="card"><div class="lbl" style="margin-bottom:10px">Войти по другому ID</div><input id="il" placeholder="Введите ID (например, QNT-5544)" autocapitalize="characters"><button class="ghost" onclick="sw()">Войти в кошелек</button></div></div></div><nav class="nav"><button class="nb on" onclick="sv('w',this)">💳 Кошелек</button><button class="nb" onclick="sv('s',this)">🛍 Магазин</button><button class="nb" onclick="sv('p',this)">👤 Профиль</button></nav><script>const FB="",DB="kv_db",IK="kv_id";let id=localStorage.getItem(IK),s={b:0,st:"Базовый",lb:0,h:[]};const hp=()=>navigator.vibrate?.(15);const ms=(m,e)=>{let x=document.getElementById("t");x.textContent=m;x.style.background=e?"var(--er)":"var(--ok)";x.style.display="block";clearTimeout(window._t);window._t=setTimeout(()=>x.style.display="none",2500)};const get=async i=>FB?(await(await fetch(`${FB}/u/${i}.json`)).json()):(JSON.parse(localStorage.getItem(DB))||{})[i];const set=async(i,d)=>{if(FB)await fetch(`${FB}/u/${i}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});else{let a=JSON.parse(localStorage.getItem(DB))||{};a[i]=d;localStorage.setItem(DB,JSON.stringify(a))}};const rn=()=>{document.getElementById("tid").textContent=id;document.getElementById("pid").textContent=id;document.getElementById("bd").textContent=Number(s.b);let p=document.getElementById("pst"),b=document.getElementById("bv");if(s.st=="VIP"){p.textContent="VIP 👑";p.className="vip";b.textContent="Куплено";b.disabled=1}else{p.textContent="Базовый";p.className="";b.textContent="150 QNT";b.disabled=0}document.getElementById("tl").innerHTML=s.h.length?s.h.slice(0,8).map(x=>`<div class="tx"><span>${x.t}</span><b style="color:${x.a>=0?'var(--ok)':'var(--er)'}">${x.a>=0?'+':''}${x.a} QNT</b></div>`).join(""):"История пуста"};async function bt(){if(!id){id="QNT-"+Math.floor(1000+Math.random()*9000);localStorage.setItem(IK,id);await set(id,s)}else{let d=await get(id);if(d)s={b:Number(d.b)||0,st:d.st||"Базовый",lb:Number(d.lb)||0,h:Array.isArray(d.h)?d.h:[]};else await set(id,s)}rn()}async function bn(){hp();if(Date.now()-s.lb<15000)return ms("Ждите "+Math.ceil((15000-(Date.now()-s.lb))/1000)+" сек.",1);s.b=Number(s.b)+20;s.lb=Date.now();s.h.unshift({t:"Бонус",a:20});rn();await set(id,s);ms("+20 QNT зачислено!")}async function vp(){hp();if(s.st=="VIP")return;if(Number(s.b)<150)return ms("Нужно 150 QNT",1);s.b=Number(s.b)-150;s.st="VIP";s.h.unshift({t:"Покупка VIP-статуса",a:-150});rn();await set(id,s);ms("VIP-статус активирован!")}const tt=()=>{hp();let c=document.getElementById("tc");c.style.display=c.style.display=="none"?"block":"none"};async function sq(){hp();let t=document.getElementById("it").value.trim().toUpperCase(),a=Math.floor(Number(document.getElementById("ia").value));if(!t||a<=0)return ms("Введите ID и сумму",1);if(t==id)return ms("Нельзя перевести себе",1);if(Number(s.b)<a)return ms("Недостаточно средств",1);let p=await get(t)||{b:0,st:"Базовый",lb:0,h:[]};s.b=Number(s.b)-a;s.h.unshift({t:`Перевод → ${t}`,a:-a});p.b=(Number(p.b)||0)+a;p.h=Array.isArray(p.h)?p.h:[];p.h.unshift({t:`Перевод ← ${id}`,a:a});await set(id,s);await set(t,p);document.getElementById("it").value="";document.getElementById("ia").value="";tt();rn();ms(`Отправлено ${a} QNT`)}async function sw(){hp();let n=document.getElementById("il").value.trim().toUpperCase();if(n.length<3)return ms("Некорректный ID",1);id=n;localStorage.setItem(IK,id);let d=await get(id);s=d?{b:Number(d.b)||0,st:d.st||"Базовый",lb:Number(d.lb)||0,h:Array.isArray(d.h)?d.h:[]}:{b:0,st:"Базовый",lb:0,h:[]};if(!d)await set(id,s);document.getElementById("il").value="";rn();ms("Вход выполнен: "+id)}async function rf(){hp();try{let d=await get(id);if(d){s.b=Number(d.b)||0;s.st=d.st||"Базовый";s.h=Array.isArray(d.h)?d.h:[];rn()}ms("Баланс обновлен")}catch{ms("Нет связи с сетью",1)}}const cp=()=>{hp();if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(id).then(()=>ms("ID скопирован!"));else{let a=document.createElement("textarea");a.value=id;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();document.execCommand("copy");document.body.removeChild(a);ms("ID скопирован!")}};const sv=(n,b)=>{hp();document.querySelectorAll(".v").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".nb").forEach(x=>x.classList.remove("on"));document.getElementById("v"+n).classList.add("on");b.classList.add("on")};bt()</script></body></html>
