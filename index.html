<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>КВАНТ — Облачный кошелек</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#090d16;color:#fff;padding:16px 16px 80px;display:flex;justify-content:center}
.app{width:100%;max-width:420px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.logo{font-size:20px;font-weight:800;color:#38bdf8}
.pill{background:#131b2e;padding:6px 12px;border-radius:20px;font-size:13px;border:1px solid #1e293b}
.tab{display:none}.tab.active{display:block}
.hero{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid #334155;border-radius:20px;padding:22px;margin-bottom:16px}
.bal{font-size:40px;font-weight:800;margin:8px 0 16px}.bal span{color:#38bdf8;font-size:20px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:none;padding:12px;border-radius:12px;font-weight:600;cursor:pointer;font-size:14px}
.b1{background:#0284c7;color:#fff}.b2{background:#1e293b;color:#fff;border:1px solid #334155}
.sm{padding:8px 12px;font-size:13px}
.card{background:#131b2e;border:1px solid #1e293b;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card p{font-size:12px;color:#94a3b8;margin-top:3px}
nav{position:fixed;bottom:0;left:0;right:0;background:#131b2e;border-top:1px solid #1e293b;display:flex;padding:8px 0 12px}
nav button{background:none;color:#94a3b8;width:33.3%;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px}
nav button.active{color:#38bdf8}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">⚡ КВАНТ</div><div class="pill" id="uid">ID: ...</div></div>
  <div id="t-w" class="tab active">
    <div class="hero">
      <div style="font-size:12px;color:#94a3b8">ОБЛАЧНЫЙ БАЛАНС</div>
      <div class="bal"><b id="mb">...</b> <span>QNT</span></div>
      <div class="row">
        <button class="b1" onclick="earn()">+ Бонус (20)</button>
        <button class="b2" onclick="send()">↗ Перевести</button>
      </div>
    </div>
    <button class="b2" style="width:100%" onclick="sync()">🔄 Обновить баланс из сети</button>
    <p id="net-msg" style="font-size:12px;color:#38bdf8;text-align:center;margin-top:10px"></p>
  </div>
  <div id="t-s" class="tab">
    <h3 style="margin-bottom:12px">Магазин наград</h3>
    <div class="card"><div><b>VIP-статус</b><p>Меняет ваш статус в базе</p></div><button class="sm b1" onclick="buyVip()">150 QNT</button></div>
  </div>
  <div id="t-p" class="tab">
    <div class="card" style="display:block;text-align:center;padding:20px">
      <h3 id="pid">Ваш ID: ...</h3>
      <p style="color:#38bdf8;margin-top:6px" id="st">Статус: Базовый</p>
      <p style="font-size:12px;color:#94a3b8;margin-top:10px">Сообщите этот ID другу для переводов.</p>
    </div>
    <button class="b2" style="width:100%;margin-top:12px" onclick="loginOther()">Войти по другому ID</button>
  </div>
</div>
<nav>
  <button class="active" onclick="go('w',this)">💳<span>Кошелек</span></button>
  <button onclick="go('s',this)">🛍️<span>Магазин</span></button>
  <button onclick="go('p',this)">👤<span>Профиль</span></button>
</nav>

<script>
const URL_BASE = 'https://supabase.co';
const API_KEY = 'sb_publishable_1SVkQ6KVIUGl07HEhwufzA_cb8i31dm';
const HEADERS = {
  'apikey': API_KEY,
  'Authorization': 'Bearer ' + API_KEY,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

let myId = localStorage.getItem('kv_id') || String(Math.floor(1000 + Math.random() * 9000));
localStorage.setItem('kv_id', myId);
document.getElementById('uid').textContent = 'ID: #' + myId;
document.getElementById('pid').textContent = 'Ваш ID: #' + myId;
let user = { id: myId, balance: 100, status: 'Базовый' };

const go = (id, el) => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.getElementById('t-' + id).classList.add('active');
  el.classList.add('active');
};

async function api(query, method = 'GET', body = null) {
  const opt = { method, headers: HEADERS };
  if (body) opt.body = JSON.stringify(body);
  const res = await fetch(URL_BASE + query, opt);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function sync() {
  const msg = document.getElementById('net-msg');
  msg.textContent = 'Синхронизация...';
  try {
    let rows = await api(`?id=eq.${myId}&select=*`);
    if (rows.length === 0) {
      rows = await api('', 'POST', [{ id: myId, balance: 100, status: 'Базовый' }]);
    }
    user = rows[0];
    document.getElementById('mb').textContent = user.balance;
    document.getElementById('st').textContent = 'Статус: ' + user.status;
    msg.textContent = 'База подключена ✓';
  } catch (e) {
    msg.textContent = 'Ошибка сети: ' + e.message;
  }
}

async function earn() {
  await sync();
  await api(`?id=eq.${myId}`, 'PATCH', { balance: user.balance + 20 });
  sync();
}

async function send() {
  const target = prompt('Введите 4-значный ID получателя (без решетки):');
  if (!target || target === myId) return;
  const sum = parseInt(prompt('Сколько QNT перевести?', '25'));
  if (!sum || sum <= 0) return;
  await sync();
  if (user.balance < sum) return alert('Недостаточно Квантов!');
  const receivers = await api(`?id=eq.${target}&select=*`);
  if (receivers.length === 0) return alert('Пользователь #' + target + ' не найден!');
  await api(`?id=eq.${myId}`, 'PATCH', { balance: user.balance - sum });
  await api(`?id=eq.${target}`, 'PATCH', { balance: receivers[0].balance + sum });
  alert(`Переведено ${sum} QNT пользователю #${target}!`);
  sync();
}

async function buyVip() {
  await sync();
  if (user.balance < 150) return alert('Нужно 150 QNT!');
  await api(`?id=eq.${myId}`, 'PATCH', { balance: user.balance - 150, status: 'VIP ⚡' });
  alert('VIP-статус активирован!');
  sync();
}

function loginOther() {
  const newId = prompt('Введите ваш 4-значный ID:');
  if (newId) { localStorage.setItem('kv_id', newId); location.reload(); }
}

sync();
</script>
</body>
</html>
